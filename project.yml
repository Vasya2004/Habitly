name: Habitly
options:
  bundleIdPrefix: com.danko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_PREVIEWS: YES
targets:
  Habitly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Habitly
    resources:
      - path: Habitly/Resources
    info:
      path: Habitly/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        CFBundleDisplayName: Habitly
        NSUserNotificationsUsageDescription: "Habitly напоминает о привычках вовремя."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - habitly
            CFBundleURLName: com.danko.habitly
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Ember:
              CFBundleIconFiles:
                - AppIcon-Ember
              UIPrerenderedIcon: false
            AppIcon-Sunset:
              CFBundleIconFiles:
                - AppIcon-Sunset
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danko.habitly
        PRODUCT_NAME: Habitly
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Habitly/App/Habitly.entitlements
    dependencies:
      - target: HabitlyWidgets
        embed: true
  HabitlyWidgets:
    type: com.apple.product-type.app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitlyWidgets
      - path: Habitly/Core/Models
      - path: Habitly/Core/Storage/SharedModelContainer.swift
      - path: Habitly/Core/Storage/ModelContextProvider.swift
      - path: Habitly/Core/Storage/HabitlySnapshot.swift
      - path: Habitly/Core/Storage/WidgetSnapshotKeychain.swift
      - path: Habitly/Core/Services/HabitToggler.swift
      - path: Habitly/Core/Services/StreakCalculator.swift
      - path: Habitly/Core/Services/Habit+Streak.swift
      - path: Habitly/DesignSystem/Colors/Theme.swift
      - path: Habitly/DesignSystem/Components/HabitIconView.swift
    info:
      path: HabitlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Habitly
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danko.habitly.widgets
        PRODUCT_NAME: HabitlyWidgets
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: HabitlyWidgets/HabitlyWidgets.entitlements
        SKIP_INSTALL: YES
  HabitlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HabitlyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danko.habitlyTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Habitly

schemes:
  Habitly:
    build:
      targets:
        Habitly: all
        HabitlyWidgets: all
        HabitlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabitlyTests
    archive:
      config: Release
